<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#550FED">
<title>Despegar Quitz · Navidad</title>
<meta name="description" content="Elegí tu destino soñado para Navidad, respondé 3 preguntas y girá la ruleta para ganar un voucher.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#550FED; --brand-dark:#3A06B0; --brand-soft:#EFE8FF;
    --sun:#FFC72C; --pink:#FF4D8D; --green:#1DBF73; --sky:#2DB7F5; --orange:#FF8A1F; --red:#F0384A;
    --ink:#1D1340; --muted:#6B6390; --white:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:Nunito,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--brand);
    background-image:radial-gradient(circle at 20% 0%,#7B3BFF 0,transparent 45%),radial-gradient(circle at 100% 100%,#3A06B0 0,transparent 50%);
    min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}
  .app{width:100%;max-width:440px;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px)}
  .topbar{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:14px}
  .logo{font-weight:900;font-size:1.55rem;letter-spacing:-.5px}
  .logo small{display:block;font-size:.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.8;margin-top:-4px}
  .pill{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem}
  .screen{flex:1;display:flex;flex-direction:column;animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card{background:#fff;border-radius:24px;padding:22px 18px;box-shadow:0 12px 0 rgba(0,0,0,.15),0 20px 40px rgba(20,0,80,.35)}
  h1{color:#fff;font-size:2rem;line-height:1.1;margin:8px 0 6px;font-weight:900}
  h2{margin:0 0 6px;font-size:1.35rem;font-weight:900;line-height:1.2}
  p.lead{color:#E9E1FF;margin:0 0 18px;font-weight:600}
  .muted{color:var(--muted);font-weight:600}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:900;font-size:1.1rem;cursor:pointer;
    background:var(--sun);color:var(--ink);box-shadow:0 6px 0 #C99600;transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #C99600}
  .btn.alt{background:#fff;color:var(--brand);box-shadow:0 6px 0 #C9B8FF}
  .btn:disabled{opacity:.6;cursor:default}
  .mt{margin-top:14px}
  /* hero */
  .hero{text-align:center;margin:auto 0}
  .hero .emoji{font-size:4.2rem;display:inline-block;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
  .steps{display:grid;gap:10px;margin:18px 0 22px;text-align:left}
  .step{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.14);color:#fff;border-radius:16px;padding:12px 14px;font-weight:800}
  .step b{width:30px;height:30px;flex:none;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center}
  /* destinations */
  .dests{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dest{border:0;border-radius:20px;padding:16px 10px 14px;color:#fff;font:inherit;cursor:pointer;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s}
  .dest:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .dest .e{font-size:2.4rem;display:block}
  .dest .n{font-weight:900;font-size:1.05rem;display:block;margin-top:4px}
  .dest .c{font-weight:700;font-size:.78rem;opacity:.9}
  /* question */
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.8rem;flex:none}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dots i{width:12px;height:12px;border-radius:50%;background:#E3DAFF}
  .dots i.ok{background:var(--green)} .dots i.now{background:var(--brand)}
  .timerbar{height:8px;background:#EFE8FF;border-radius:8px;overflow:hidden;margin:4px 0 16px}
  .timerbar i{display:block;height:100%;background:var(--brand);transform-origin:left}
  .qtext{font-size:1.25rem;font-weight:900;margin:0 0 16px;line-height:1.3}
  .opts{display:grid;gap:10px}
  .opt{border:0;border-radius:14px;padding:15px 14px;font:inherit;font-weight:800;font-size:1rem;text-align:left;cursor:pointer;
    background:var(--brand-soft);color:var(--ink);box-shadow:0 4px 0 #D3C4FF;transition:transform .08s}
  .opt:active{transform:translateY(3px)}
  .opt.ok{background:var(--green);color:#fff;box-shadow:0 4px 0 #128A52}
  .opt.bad{background:var(--red);color:#fff;box-shadow:0 4px 0 #A81D2C;animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .opt:disabled{cursor:default}
  .feedback{text-align:center;font-weight:900;font-size:1.1rem;margin-top:14px;min-height:1.4em}
  /* wheel */
  .wheelwrap{position:relative;width:min(88vw,360px);aspect-ratio:1;margin:8px auto 18px}
  .wheel{width:100%;height:100%;border-radius:50%;border:10px solid #fff;box-shadow:0 0 0 6px var(--sun),0 16px 40px rgba(0,0,0,.35);
    transition:transform 5.2s cubic-bezier(.12,.72,.08,1)}
  .wheel svg{width:100%;height:100%;display:block}
  .pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--sun);filter:drop-shadow(0 4px 2px rgba(0,0,0,.3));z-index:2}
  .hub{position:absolute;inset:50% auto auto 50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;
    display:grid;place-items:center;font-weight:900;color:var(--brand);font-size:.85rem;box-shadow:0 4px 10px rgba(0,0,0,.3);text-align:center;line-height:1}
  /* voucher */
  .voucher{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 40px rgba(20,0,80,.35);position:relative}
  .voucher .vt{background:var(--sun);padding:18px;text-align:center}
  .voucher .amt{font-size:3.2rem;font-weight:900;line-height:1;color:var(--ink)}
  .voucher .vb{padding:18px;text-align:center;border-top:3px dashed #E3DAFF}
  .code{display:inline-block;margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:1.2rem;letter-spacing:2px;background:var(--brand-soft);color:var(--brand);padding:8px 14px;border-radius:10px}
  .fine{font-size:.75rem;color:var(--muted);margin-top:12px}
  .center{text-align:center}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .footer{color:#D6C9FF;font-size:.72rem;text-align:center;margin-top:16px;font-weight:600}
  .footer a{color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">despegar<small>Quitz navideño</small></div>
    <div class="pill" id="pill">🎄 Navidad</div>
  </div>
  <main id="view" class="screen"></main>
  <div class="footer">Promoción de ejemplo. Vouchers sujetos a bases y condiciones. · <a href="qr.html">Ver QR</a></div>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* ---------- Datos ---------- */
const DESTINOS = [
  {id:"bariloche", n:"Bariloche", c:"Argentina", e:"🏔️", col:"#2DB7F5", qs:[
    {q:"¿En qué provincia está Bariloche?", o:["Río Negro","Mendoza","Salta","Misiones"], a:0},
    {q:"¿Por qué dulce es famosa Bariloche?", o:["Chocolate","Alfajor de maicena","Dulce de batata","Turrón"], a:0},
    {q:"¿Cómo se llama el gran lago frente a la ciudad?", o:["Nahuel Huapi","Titicaca","Lago Argentino","Mar Chiquita"], a:0}]},
  {id:"rio", n:"Río de Janeiro", c:"Brasil", e:"🏖️", col:"#1DBF73", qs:[
    {q:"¿En qué país está Río de Janeiro?", o:["Brasil","Chile","México","Uruguay"], a:0},
    {q:"¿Qué estatua famosa mira la ciudad desde el Corcovado?", o:["El Cristo Redentor","La Estatua de la Libertad","El Ángel de la Independencia","El Obelisco"], a:0},
    {q:"¿Cuál de estas playas está en Río?", o:["Copacabana","Punta del Este","Varadero","Waikiki"], a:0}]},
  {id:"nyc", n:"Nueva York", c:"Estados Unidos", e:"🗽", col:"#FF4D8D", qs:[
    {q:"¿Qué estatua recibe a los barcos en Nueva York?", o:["La Estatua de la Libertad","El Cristo Redentor","La Sirenita","El Moái"], a:0},
    {q:"¿Cómo se llama el gran parque en Manhattan?", o:["Central Park","Hyde Park","Parque Rodó","Retiro"], a:0},
    {q:"¿Dónde está el famoso árbol de Navidad gigante?", o:["Rockefeller Center","Torre Eiffel","Plaza de Mayo","Big Ben"], a:0}]},
  {id:"madrid", n:"Madrid", c:"España", e:"🏰", col:"#FF8A1F", qs:[
    {q:"¿En qué país está Madrid?", o:["España","Italia","Portugal","Francia"], a:0},
    {q:"¿Cuál es la plaza más famosa del centro, donde se toman las uvas en Año Nuevo?", o:["Puerta del Sol","Times Square","Plaza San Marcos","Trafalgar"], a:0},
    {q:"¿Cómo se llama el famoso museo de arte de Madrid?", o:["Museo del Prado","Louvre","MoMA","Museo Británico"], a:0}]},
  {id:"cancun", n:"Cancún", c:"México", e:"🌴", col:"#F0384A", qs:[
    {q:"¿En qué país está Cancún?", o:["México","Cuba","Colombia","Perú"], a:0},
    {q:"¿Qué mar baña sus playas?", o:["Mar Caribe","Mar Mediterráneo","Mar del Norte","Mar Muerto"], a:0},
    {q:"¿Qué civilización antigua dejó ruinas cerca, como Chichén Itzá?", o:["Maya","Inca","Romana","Egipcia"], a:0}]},
  {id:"paris", n:"París", c:"Francia", e:"🗼", col:"#7B3BFF", qs:[
    {q:"¿Cuál es el monumento más famoso de París?", o:["La Torre Eiffel","El Coliseo","La Torre de Pisa","El Big Ben"], a:0},
    {q:"¿Qué río atraviesa París?", o:["El Sena","El Támesis","El Danubio","El Paraná"], a:0},
    {q:"¿En qué museo está la Mona Lisa?", o:["El Louvre","El Prado","El Vaticano","El Guggenheim"], a:0}]},
];

/* Ruleta: probabilidad inversa al monto. Suma = 100. */
const PREMIOS = [
  {v:50,   label:"50",   p:30, col:"#2DB7F5"},
  {v:200,  label:"200",  p:15, col:"#FF4D8D"},
  {v:0,    label:"OTRA", p:12, col:"#1D1340", again:true},
  {v:500,  label:"500",  p:4,  col:"#1DBF73"},
  {v:100,  label:"100",  p:22, col:"#FF8A1F"},
  {v:400,  label:"400",  p:6,  col:"#7B3BFF"},
  {v:1000, label:"1000", p:1,  col:"#F0384A"},
  {v:300,  label:"300",  p:10, col:"#FFC72C", dark:true},
];
const SECONDS = 20;

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const view = $("#view");
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const buzz = ms => {try{navigator.vibrate && navigator.vibrate(ms)}catch(e){}};
function render(html){view.classList.remove("screen");void view.offsetWidth;view.classList.add("screen");view.innerHTML=html;window.scrollTo(0,0)}

let state = {dest:null, qi:0, ok:0, timer:null, spinning:false, rot:0};

/* ---------- Pantallas ---------- */
function home(){
  render(`<div class="hero">
    <div class="emoji">✈️</div>
    <h1>¿A dónde soñás pasar esta Navidad?</h1>
    <p class="lead">Respondé 3 preguntas fáciles y girá la ruleta para ganar un voucher de hasta USD 1000 en tu pasaje.</p>
    <div class="steps">
      <div class="step"><b>1</b>Elegí tu destino soñado</div>
      <div class="step"><b>2</b>Acertá 3 preguntas fáciles</div>
      <div class="step"><b>3</b>Girá la ruleta y ganá</div>
    </div>
    <button class="btn" id="go">¡Jugar ahora!</button>
  </div>`);
  $("#go").onclick = pickDest;
}

function pickDest(){
  render(`<h1>Elegí tu destino</h1><p class="lead">El voucher que ganes va a ser para un pasaje a ese lugar.</p>
    <div class="dests">${DESTINOS.map(d=>`<button class="dest" style="background:${d.col}" data-id="${d.id}">
      <span class="e">${d.e}</span><span class="n">${d.n}</span><span class="c">${d.c}</span></button>`).join("")}</div>`);
  view.querySelectorAll(".dest").forEach(b=>b.onclick=()=>{
    state.dest = DESTINOS.find(d=>d.id===b.dataset.id); state.qi=0; state.ok=0;
    state.qs = shuffle(state.dest.qs); buzz(20); question();
  });
}

function question(){
  const d = state.dest, q = state.qs[state.qi];
  const opts = shuffle(q.o.map((t,i)=>({t,i})));
  $("#pill").textContent = `${d.e} ${d.n}`;
  render(`<div class="card">
    <div class="qhead"><div class="badge" style="background:${d.col}">${d.e}</div>
      <div><div class="muted">Pregunta ${state.qi+1} de 3</div><b>${d.n}</b></div>
      <div class="dots">${[0,1,2].map(k=>`<i class="${k<state.qi?'ok':k===state.qi?'now':''}"></i>`).join("")}</div></div>
    <div class="timerbar"><i id="tb"></i></div>
    <p class="qtext">${q.q}</p>
    <div class="opts">${opts.map(o=>`<button class="opt" data-i="${o.i}">${o.t}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div></div>`);
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const tb = $("#tb"); tb.style.transition="none"; tb.style.transform="scaleX(1)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{tb.style.transition=`transform ${SECONDS}s linear`;tb.style.transform="scaleX(0)"}));
  clearTimeout(state.timer); state.timer = setTimeout(()=>answer(-1), SECONDS*1000);
}

function answer(pick){
  clearTimeout(state.timer);
  const q = state.qs[state.qi], right = pick===q.a;
  $("#tb").style.transition="none";
  view.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.i;
    if(v===q.a) b.classList.add("ok"); else if(v===pick) b.classList.add("bad");});
  $("#fb").textContent = right ? "¡Correcto! 🎉" : (pick<0 ? "⏰ ¡Se acabó el tiempo!" : "Uy, esa no era 😅");
  $("#fb").style.color = right ? "var(--green)" : "var(--red)";
  buzz(right?30:[60,40,60]);
  setTimeout(()=>{
    if(!right) return fail();
    state.ok++; state.qi++;
    state.qi<3 ? question() : wheel();
  }, 1100);
}

function fail(){
  render(`<div class="hero"><div class="emoji">🧳</div>
    <h1>¡Casi!</h1><p class="lead">Para girar la ruleta tenés que acertar las 3 preguntas. ¿Probamos de nuevo?</p>
    <button class="btn" id="retry">Intentar otra vez</button>
    <button class="btn alt mt" id="other">Cambiar destino</button></div>`);
  $("#retry").onclick = ()=>{state.qi=0;state.ok=0;state.qs=shuffle(state.dest.qs);question()};
  $("#other").onclick = pickDest;
}

function wheelSVG(){
  const n = PREMIOS.length, r = 100, seg = 360/n;
  const pt = (deg,rad)=>{const a=(deg-90)*Math.PI/180;return [r+rad*Math.cos(a), r+rad*Math.sin(a)]};
  let s = "";
  PREMIOS.forEach((p,i)=>{
    const a0=i*seg, a1=a0+seg, [x0,y0]=pt(a0,r), [x1,y1]=pt(a1,r);
    s += `<path d="M${r},${r} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z" fill="${p.col}" stroke="#fff" stroke-width="1.5"/>`;
    const mid=a0+seg/2, [tx,ty]=pt(mid,r*0.66);
    const fill = p.dark ? "#1D1340" : "#fff";
    const main = p.again ? "TIRÁ" : p.label, sub = p.again ? "DE NUEVO" : "USD";
    s += `<g transform="translate(${tx},${ty}) rotate(${mid})"><text text-anchor="middle" fill="${fill}" font-family="Nunito" font-weight="900" font-size="${p.again?12:(p.label.length>3?15:18)}" y="0">${main}</text>
      <text text-anchor="middle" fill="${p.again?'#FFC72C':fill}" font-family="Nunito" font-weight="900" font-size="${p.again?8:8}" y="10">${sub}</text></g>`;
  });
  return `<svg viewBox="0 0 200 200">${s}</svg>`;
}

function wheel(again){
  $("#pill").textContent = `${state.dest.e} ${state.dest.n}`;
  render(`<div class="center"><h1>${again?"¡Tirá de nuevo!":"¡3 de 3! 🎉"}</h1>
    <p class="lead">Girá la ruleta y ganá un voucher para tu pasaje a ${state.dest.n}.</p></div>
    <div class="wheelwrap"><div class="pointer"></div><div class="wheel" id="wheel" style="transform:rotate(${state.rot}deg)">${wheelSVG()}</div><div class="hub">GIRÁ</div></div>
    <button class="btn" id="spin">¡Girar la ruleta!</button>`);
  $("#spin").onclick = spin;
  view.querySelector(".hub").onclick = spin;
}

function pickPrize(){
  let x = Math.random()*100;
  for(let i=0;i<PREMIOS.length;i++){ if((x-=PREMIOS[i].p) < 0) return i; }
  return 0;
}

function spin(){
  if(state.spinning) return; state.spinning = true;
  $("#spin").disabled = true; buzz(20);
  const i = pickPrize(), seg = 360/PREMIOS.length;
  const jitter = (Math.random()-.5)*seg*0.7;
  const target = 360 - (i*seg + seg/2) + jitter;           // ángulo que deja el premio bajo el puntero
  const base = state.rot - (state.rot % 360);
  state.rot = base + 360*6 + ((target%360)+360)%360;
  $("#wheel").style.transform = `rotate(${state.rot}deg)`;
  setTimeout(()=>{
    state.spinning = false;
    const p = PREMIOS[i];
    if(p.again){ buzz([40,40,40]); return wheel(true); }
    const v = {amount:p.v, dest:state.dest.n, emoji:state.dest.e, code:makeCode(p.v), date:new Date().toISOString()};
    confetti(); buzz([80,50,120]);
    voucher(v);
  }, 5400);
}

function makeCode(v){
  const abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  for(let k=0;k<6;k++) s+=abc[Math.floor(Math.random()*abc.length)];
  return `NAV${v}-${s}`;
}

function voucher(v, returning){
  $("#pill").textContent = `${v.emoji} ${v.dest}`;
  render(`<div class="center"><h1>${returning?"Tu voucher":"¡Ganaste!"}</h1>
    <p class="lead">${returning?"Ya participaste desde este celular. Este es tu premio:":"Usalo en la compra de tu pasaje."}</p></div>
    <div class="voucher"><div class="vt"><div class="muted" style="color:#5a4a00">VOUCHER</div><div class="amt">USD ${v.amount}</div></div>
      <div class="vb"><div style="font-size:2rem">${v.emoji}</div><h2>Pasaje a ${v.dest}</h2>
        <div class="muted">Tu código</div><div class="code">${v.code}</div>
        <div class="fine">Sacale captura a esta pantalla. Válido para la compra de pasajes a ${v.dest}. Sujeto a bases y condiciones de la promoción.</div></div></div>
    <button class="btn mt" id="share">Compartir</button>
    <button class="btn alt mt" id="again">Jugar de nuevo</button>`);
  $("#again").onclick = ()=>{ $("#pill").textContent="🎄 Navidad"; pickDest(); };
  $("#share").onclick = async ()=>{
    const text = `¡Gané un voucher de USD ${v.amount} para viajar a ${v.dest} en el Quitz navideño de Despegar! ✈️🎄`;
    try{ if(navigator.share) await navigator.share({title:"Despegar Quitz",text,url:location.origin+location.pathname}); else { await navigator.clipboard.writeText(text+" "+location.href); $("#share").textContent="¡Copiado!"; } }catch(e){}
  };
}

function confetti(){
  const c = $("#confetti"), cols=["#FFC72C","#FF4D8D","#2DB7F5","#1DBF73","#fff","#FF8A1F"];
  for(let k=0;k<90;k++){const i=document.createElement("i");
    i.style.left=Math.random()*100+"vw"; i.style.background=cols[k%cols.length];
    i.style.animationDuration=(2+Math.random()*2)+"s"; i.style.animationDelay=Math.random()*.6+"s";
    c.appendChild(i);}
  setTimeout(()=>c.innerHTML="",5000);
}

try{localStorage.removeItem("dq-voucher")}catch(e){}
home();
</script>
</body>
</html>
