<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#270570">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg">
<title>Despegar Quitz · Navidad</title>
<meta name="description" content="Elegí tu destino soñado para Navidad, respondé 3 preguntas y girá la ruleta para ganar un voucher.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --top:#270570; --brand:#4300D2; --brand-2:#7C4DFF; --cta:#E61A06; --cta-dark:#C21505; --teal:#028574;
    --ink:#323439; --muted:#72777F; --line:#DDE1E8; --bg:#F2F4F5; --soft:#EFEAFB; --ok:#028574; --bad:#E61A06; --white:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:Rubik,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}
  .app{width:100%;max-width:440px;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
  .topbar{background:var(--top);border-radius:0 0 18px 18px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
  .topbar img{height:28px;width:auto;display:block}
  .topbar .tag{color:#fff;font-size:.8rem;font-weight:500;opacity:.9}
  .screen{flex:1;display:flex;flex-direction:column;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px}
  h1{color:var(--ink);font-size:1.45rem;line-height:1.2;margin:12px 0 6px;font-weight:600}
  h2{margin:0 0 6px;font-size:1.2rem;font-weight:600;line-height:1.2}
  p.lead{color:var(--muted);margin:0 0 12px;font-size:.95rem;line-height:1.4}
  .muted{color:var(--muted);font-size:.85rem}
  .btn{display:block;width:100%;border:0;border-radius:24px;padding:14px;font:inherit;font-weight:500;font-size:1rem;cursor:pointer;background:var(--cta);color:#fff}
  .btn:active{background:var(--cta-dark)}
  .btn.alt{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .btn:disabled{opacity:.6;cursor:default}
  .mt{margin-top:10px}
  /* escena: el avión queda quieto, las nubes pasan y el cielo cambia de día a noche en degradé */
  .scene{position:relative;height:150px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#120338 0%,#2A0A8C 55%,#5B2EE6 100%)}
  .scene .sky{position:absolute;inset:0;transition:opacity 8s ease-in-out}
  .scene .sky.day{background:linear-gradient(180deg,#3E8FD9 0%,#7CC5F2 60%,#BFE6FF 100%);opacity:0}
  .scene.day .sky.day{opacity:1}
  .scene .sun{position:absolute;left:80%;top:24%;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#FFFBE6 0%,#FFE98A 55%,#FFC83D 100%);box-shadow:0 0 14px 6px rgba(255,225,120,.55),0 0 40px 18px rgba(255,210,90,.22);transform:translate(-50%,-50%);animation:drift 70s ease-in-out infinite alternate}
  .scene .moon{position:absolute;left:80%;top:24%;width:36px;height:36px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 5px rgba(255,244,207,.7)) drop-shadow(0 0 14px rgba(255,240,200,.35));animation:drift 200s linear infinite alternate}
  .scene .moon svg{width:100%;height:100%;display:block}
  .scene .moon .ph{display:none}
  .scene .moon.p1 .ph1,.scene .moon.p2 .ph2,.scene .moon.p3 .ph3{display:block}
  @keyframes drift{from{transform:translate(-50%,-50%)}to{transform:translate(-50%,calc(-50% - 7px)) translateX(-10px)}}
  .scene .starswrap{position:absolute;inset:0;transition:opacity 8s ease-in-out;pointer-events:none}
  .scene.day .starswrap{opacity:0}
  .scene .layer{position:absolute;inset:0;background-repeat:repeat-x;background-size:400px 100%}
  .scene .stars{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 70px,#fff,transparent),radial-gradient(1px 1px at 160px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 230px 55px,#fff,transparent),radial-gradient(1px 1px at 300px 35px,#fff,transparent),radial-gradient(1.5px 1.5px at 350px 80px,#fff,transparent);animation:scroll 90s linear infinite,twinkle 2.4s ease-in-out infinite}
  .scene .stars.b{background-image:radial-gradient(1px 1px at 55px 15px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 45px,#fff,transparent),radial-gradient(1px 1px at 200px 95px,#fff,transparent),radial-gradient(1.5px 1.5px at 260px 25px,#fff,transparent),radial-gradient(1px 1px at 330px 60px,#fff,transparent),radial-gradient(1.5px 1.5px at 380px 15px,#fff,transparent);animation:scroll 90s linear infinite,twinkle 3.1s ease-in-out infinite 1.3s}
  @keyframes scroll{to{background-position:-400px 0}}
  @keyframes twinkle{0%,100%{opacity:.95}50%{opacity:.25}}
  .scene .belen{position:absolute;left:22%;top:13%;width:20px;height:26px;transform:translate(-50%,-50%);animation:belen 3.2s ease-in-out infinite}
  .scene .belen svg{display:block;width:100%;height:100%;overflow:visible}
  @keyframes belen{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1;filter:drop-shadow(0 0 4px rgba(255,240,180,.8))}35%{opacity:.75}50%{transform:translate(-50%,-50%) scale(1.1);opacity:1;filter:drop-shadow(0 0 8px rgba(255,240,180,1))}70%{opacity:.8}}
  .scene .belen .tw{transform-box:fill-box;transform-origin:center;animation:beltw 1.6s ease-in-out infinite alternate}
  .scene .belen .tw:nth-child(2){animation-delay:-.6s} .scene .belen .tw:nth-child(3){animation-delay:-1.1s}
  @keyframes beltw{from{transform:scale(.6);opacity:.5}to{transform:scale(1.15);opacity:1}}
  .scene .fugaz{position:absolute;width:90px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);transform-origin:100% 50%;transform:rotate(-20deg);opacity:0;animation:fugaz 1.3s ease-out forwards;pointer-events:none}
  @keyframes fugaz{0%{opacity:0;transform:rotate(-20deg) translateX(0)}10%{opacity:1}100%{opacity:0;transform:rotate(-20deg) translateX(-260px)}}
  .scene .plane{position:absolute;z-index:3;left:38%;top:50%;width:147px;height:auto;transform:translate(-50%,-50%);animation:fly 5s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
  @keyframes fly{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 2px))}}
  .scene.sm{height:110px} .scene.sm .plane{width:105px}
  @keyframes pass{to{transform:translateX(-720px)}}
  /* lluvia y nieve suaves, cada tanto */
  .scene .weather{position:absolute;inset:-12% -10% 0 -10%;z-index:5;pointer-events:none;opacity:0;transition:opacity 4s ease;overflow:hidden}
  .scene .weather.on{opacity:1}
  .scene .weather.rain{transform:rotate(7deg) scale(1.15)}
  .scene .weather i{position:absolute;top:-6%;left:var(--x);opacity:var(--o);animation-timing-function:linear;animation-iteration-count:infinite;animation-duration:var(--d);animation-delay:var(--dl)}
  .scene .weather.rain i{width:1px;height:var(--s);border-radius:1px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.75));animation-name:drop}
  .scene .weather.snow i{width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 2px rgba(255,255,255,.6);animation-name:flake}
  @keyframes drop{to{transform:translateY(120vh) translateY(140px)}}
  @keyframes flake{0%{transform:translate(0,0)}25%{transform:translate(var(--sw),30vh) translateY(40px)}50%{transform:translate(calc(var(--sw)*-.6),60vh) translateY(80px)}75%{transform:translate(var(--sw),90vh) translateY(120px)}100%{transform:translate(0,120vh) translateY(160px)}}
  /* objetos que pasan volando (sprites del usuario) con efectos animados */
  .scene .obj{position:absolute;left:100%;animation:pass linear forwards;will-change:transform;line-height:0}
  .scene .obj > img{display:block;width:100%;height:auto}
  .scene .fx{position:absolute;width:0;height:0}
  .scene .fx > *{position:absolute;display:block}
  .fx .flame{right:0;top:calc(var(--s)*-.25);width:var(--s);height:calc(var(--s)*.5);transform-origin:100% 50%;transform:rotate(var(--r,0deg));animation:flick .16s ease-in-out infinite alternate}
  .fx .flame svg{width:100%;height:100%;display:block;overflow:visible}
  @keyframes flick{from{transform:rotate(var(--r,0deg)) scale(1,1)}to{transform:rotate(var(--r,0deg)) scale(1.3,.8)}}
  .fx .glow{right:0;top:calc(var(--h)*-.5);width:var(--s);height:var(--h);border-radius:50%;background:radial-gradient(ellipse at 90% 50%,#DFF9FF 0%,#4FC3FF 35%,rgba(79,195,255,0) 72%);transform-origin:100% 50%;transform:rotate(var(--r,0deg));animation:pulse .45s ease-in-out infinite alternate}
  @keyframes pulse{from{opacity:.7;transform:rotate(var(--r,0deg)) scale(.9,1)}to{opacity:1;transform:rotate(var(--r,0deg)) scale(1.15,1.05)}}
  .fx .blink{width:max(var(--s),3px);height:max(var(--s),3px);margin:calc(max(var(--s),3px)*-.5);border-radius:50%;background:var(--c);box-shadow:0 0 calc(var(--s)*.9) var(--c);animation:blink 4.2s steps(1) infinite;animation-delay:var(--d,0s)}
  @keyframes blink{0%,14%{opacity:1}15%,100%{opacity:.12}}
  .fx .prop{width:var(--s);height:var(--s);margin:calc(var(--s)*-.5);transform:scaleX(var(--k,.22))}
  .fx .prop svg{width:100%;height:100%;display:block}
  .fx .prop .spin{transform-box:fill-box;transform-origin:center;animation:spin .18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fx .rotor{width:var(--s);height:calc(var(--s)*.045);margin:calc(var(--s)*-.0225) calc(var(--s)*-.5);background:rgba(63,63,71,.75);border-radius:1em;animation:rotor .2s linear infinite}
  @keyframes rotor{0%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.12);opacity:.5}100%{transform:scaleX(1);opacity:.9}}
  /* Papá Noel: renos con vuelo propio, regalos que caen */
  .scene .obj .part{position:absolute;top:0;animation:hover ease-in-out infinite alternate}
  .scene .obj .part img.wing{position:absolute;left:0;top:0;width:100%;animation:flap ease-in-out infinite alternate}
  @keyframes flap{from{transform:scaleY(1) rotate(0)}to{transform:scaleY(.28) rotate(-4deg)}}
  .scene .obj .part img.front{position:relative;z-index:1}
  .scene .obj .stunt{display:block;position:relative;transform-origin:50% 50%;animation:pirueta 6s ease-in-out infinite}
  @keyframes pirueta{0%,20%{transform:rotate(0) rotateX(0)}42%{transform:rotate(-360deg) rotateX(0) translateY(-6px)}50%,62%{transform:rotate(-360deg) rotateX(0)}80%{transform:rotate(-360deg) rotateX(360deg)}100%{transform:rotate(-360deg) rotateX(360deg)}}
  .scene .obj .part img.wing.back{z-index:0}
  @keyframes capa{0%{transform:skewY(-7deg) scaleY(.9)}50%{transform:skewY(2deg) scaleY(1.04) scaleX(1.03)}100%{transform:skewY(6deg) scaleY(1.08)}}
  .scene .obj .part img{display:block;width:100%;height:auto}
  @keyframes hover{from{transform:translateY(-4%)}to{transform:translateY(5%)}}
  .scene .laser{position:absolute;z-index:4;width:14px;height:2px;border-radius:2px;background:#FF3B3B;box-shadow:0 0 4px #FF5A5A;animation:laser .55s linear forwards;pointer-events:none}
  @keyframes laser{to{transform:translateX(-240px);opacity:.15}}
  .scene .gift{position:absolute;z-index:4;animation:giftx 2.6s linear forwards;pointer-events:none}
  .scene .gift > i{display:block;animation:gifty 2.6s cubic-bezier(.3,0,.8,.4) forwards}
  .scene .gift svg{display:block;width:100%;height:auto;animation:giftspin 1.6s linear infinite}
  @keyframes giftx{to{transform:translateX(var(--dx))}}
  @keyframes gifty{0%{transform:translateY(0)}18%{transform:translateY(-22px)}100%{transform:translateY(240px)}}
  @keyframes giftspin{to{transform:rotate(360deg)}}
  .scene .cloud{position:absolute;left:100%;width:110px;animation:pass linear forwards;will-change:transform}
  .scene .cloud svg{display:block;width:100%;height:auto}
  /* portada */
  .hero{display:flex;flex-direction:column;flex:1}
  .hero .grow{flex:1}
  /* la portada va de borde a borde, como la barra del logo */
  .screen.edge{padding-left:0;padding-right:0}
  .hero > .scene{border-radius:18px}
  .hero h1.one{font-family:Rubik,Arial,sans-serif;font-weight:700;text-align:center;font-size:clamp(1.05rem,5.6vw,1.45rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .steps{display:grid;gap:8px;margin:12px 0 14px}
  .step{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem;font-weight:500}
  .step b{width:26px;height:26px;flex:none;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:500}
  /* destinos */
  .dests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dest{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px 12px;color:var(--ink);font:inherit;cursor:pointer;text-align:center}
  .dest:active{border-color:var(--brand);background:var(--soft)}
  .dest .e{font-size:2.1rem;display:block}
  .dest .n{font-weight:600;font-size:1rem;display:block;margin-top:4px}
  .dest .c{font-size:.78rem;color:var(--muted)}
  /* pregunta */
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;flex:none;background:var(--soft)}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .dots i.ok{background:var(--teal)} .dots i.now{background:var(--brand)}
  .timerbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 14px}
  .timerbar i{display:block;height:100%;background:var(--brand);transform-origin:left}
  .qtext{font-size:1.1rem;font-weight:600;margin:0 0 14px;line-height:1.3}
  .opts{display:grid;gap:8px}
  .opt{border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:.98rem;text-align:left;cursor:pointer;background:#fff;color:var(--ink)}
  .opt:active{border-color:var(--brand);background:var(--soft)}
  .opt.ok{background:var(--teal);border-color:var(--teal);color:#fff}
  .opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .opt:disabled{cursor:default}
  .feedback{text-align:center;font-weight:600;margin-top:12px;min-height:1.3em}
  /* ruleta */
  .wheelwrap{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:6px auto 14px}
  .wheel{width:100%;height:100%;border-radius:50%;border:6px solid #fff;outline:1px solid var(--line);will-change:transform}
  .wheel svg{width:100%;height:100%;display:block}
  .pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid var(--cta);z-index:2}
  .hub{position:absolute;inset:50% auto auto 50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;color:var(--brand);font-size:.8rem;text-align:center;line-height:1}
  /* voucher */
  .voucher{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .voucher .vt{background:var(--brand);color:#fff;padding:16px;text-align:center}
  .voucher .vt .muted{color:rgba(255,255,255,.8)}
  .voucher .amt{font-size:2.6rem;font-weight:700;line-height:1.1}
  .voucher .vb{padding:16px;text-align:center}
  .code{display:inline-block;margin-top:6px;font-family:ui-monospace,Menlo,monospace;font-weight:600;font-size:1.1rem;letter-spacing:2px;background:var(--soft);color:var(--brand);padding:8px 14px;border-radius:8px}
  .fine{font-size:.74rem;color:var(--muted);margin-top:10px;line-height:1.4}
  .center{text-align:center}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti i{position:absolute;top:-20px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .footer{color:var(--muted);font-size:.7rem;text-align:center;padding:0 16px 10px}
  .footer a{color:var(--brand)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="https://www.despegar.com.ar/" aria-label="Despegar"><img src="/logo.svg" alt="despegar" width="148" height="32"></a>
    <span class="tag" id="pill"></span>
  </div>
  <main id="view" class="screen"></main>
  <div class="footer">Promoción de ejemplo. Vouchers sujetos a bases y condiciones. · <span id="qrlink"><a href="/afiche">Ver QR</a></span></div>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* ---------- Datos ---------- */
const DESTINOS = [
  {id:"bariloche", n:"Bariloche", c:"Argentina", e:"🏔️", col:"#2DB7F5", qs:[
    {q:"¿En qué provincia está Bariloche?", o:["Río Negro","Mendoza","Salta","Misiones"], a:0},
    {q:"¿Por qué dulce es famosa Bariloche?", o:["Chocolate","Alfajor de maicena","Dulce de batata","Turrón"], a:0},
    {q:"¿Cómo se llama el gran lago frente a la ciudad?", o:["Nahuel Huapi","Titicaca","Lago Argentino","Mar Chiquita"], a:0}]},
  {id:"rio", n:"Río de Janeiro", c:"Brasil", e:"🏖️", col:"#1DBF73", qs:[
    {q:"¿En qué país está Río de Janeiro?", o:["Brasil","Chile","México","Uruguay"], a:0},
    {q:"¿Qué estatua famosa mira la ciudad desde el Corcovado?", o:["El Cristo Redentor","La Estatua de la Libertad","El Ángel de la Independencia","El Obelisco"], a:0},
    {q:"¿Cuál de estas playas está en Río?", o:["Copacabana","Punta del Este","Varadero","Waikiki"], a:0}]},
  {id:"nyc", n:"Nueva York", c:"Estados Unidos", e:"🗽", col:"#FF4D8D", qs:[
    {q:"¿Qué estatua recibe a los barcos en Nueva York?", o:["La Estatua de la Libertad","El Cristo Redentor","La Sirenita","El Moái"], a:0},
    {q:"¿Cómo se llama el gran parque en Manhattan?", o:["Central Park","Hyde Park","Parque Rodó","Retiro"], a:0},
    {q:"¿Dónde está el famoso árbol de Navidad gigante?", o:["Rockefeller Center","Torre Eiffel","Plaza de Mayo","Big Ben"], a:0}]},
  {id:"madrid", n:"Madrid", c:"España", e:"🏰", col:"#FF8A1F", qs:[
    {q:"¿En qué país está Madrid?", o:["España","Italia","Portugal","Francia"], a:0},
    {q:"¿Cuál es la plaza más famosa del centro, donde se toman las uvas en Año Nuevo?", o:["Puerta del Sol","Times Square","Plaza San Marcos","Trafalgar"], a:0},
    {q:"¿Cómo se llama el famoso museo de arte de Madrid?", o:["Museo del Prado","Louvre","MoMA","Museo Británico"], a:0}]},
  {id:"cancun", n:"Cancún", c:"México", e:"🌴", col:"#F0384A", qs:[
    {q:"¿En qué país está Cancún?", o:["México","Cuba","Colombia","Perú"], a:0},
    {q:"¿Qué mar baña sus playas?", o:["Mar Caribe","Mar Mediterráneo","Mar del Norte","Mar Muerto"], a:0},
    {q:"¿Qué civilización antigua dejó ruinas cerca, como Chichén Itzá?", o:["Maya","Inca","Romana","Egipcia"], a:0}]},
  {id:"paris", n:"París", c:"Francia", e:"🗼", col:"#7B3BFF", qs:[
    {q:"¿Cuál es el monumento más famoso de París?", o:["La Torre Eiffel","El Coliseo","La Torre de Pisa","El Big Ben"], a:0},
    {q:"¿Qué río atraviesa París?", o:["El Sena","El Támesis","El Danubio","El Paraná"], a:0},
    {q:"¿En qué museo está la Mona Lisa?", o:["El Louvre","El Prado","El Vaticano","El Guggenheim"], a:0}]},
];

/* Ruleta: probabilidad inversa al monto. Suma = 100. */
const PREMIOS = [
  {v:50,   label:"50",   p:400,  col:"#7C4DFF"},
  {v:200,  label:"200",  p:25,   col:"#028574"},
  {v:0,    label:"OTRA", p:60,   col:"#323439", again:true},
  {v:500,  label:"500",  p:4,    col:"#4300D2"},
  {v:100,  label:"100",  p:100,  col:"#00A58E"},
  {v:400,  label:"400",  p:6.25, col:"#270570"},
  {v:1000, label:"1000", p:1,    col:"#E61A06"},
  {v:300,  label:"300",  p:11.1, col:"#DDE1E8", dark:true},
];
const SECONDS = 20;

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const view = $("#view");
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function question(){
  const d = state.dest, q = state.qs[state.qi];
  const opts = shuffle(q.o.map((t,i)=>({t,i})));
  $("#pill").textContent = `${d.e} ${d.n}`;
  render(`<div class="card">
    <div class="qhead"><div class="badge" style="background:${d.col}">${d.e}</div>
      <div><div class="muted">Pregunta ${state.qi+1} de 3</div><b>${d.n}</b></div>
      <div class="dots">${[0,1,2].map(k=>`<i class="${k<state.qi?'ok':k===state.qi?'now':''}"></i>`).join("")}</div></div>
    <div class="timerbar"><i id="tb"></i></div>
    <p class="qtext">${q.q}</p>
    <div class="opts">${opts.map(o=>`<button class="opt" data-i="${o.i}">${o.t}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div></div>`);
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const tb = $("#tb"); tb.style.transition="none"; tb.style.transform="scaleX(1)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{tb.style.transition=`transform ${SECONDS}s linear`;tb.style.transform="scaleX(0)"}));
  clearTimeout(state.timer); state.timer = setTimeout(()=>answer(-1), SECONDS*1000);
}

function answer(pick){
  clearTimeout(state.timer);
  const q = state.qs[state.qi], right = pick===q.a;
  $("#tb").style.transition="none";
  view.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.i;
    if(v===q.a) b.classList.add("ok"); else if(v===pick) b.classList.add("bad");});
  $("#fb").textContent = right ? "¡Correcto! 🎉" : (pick<0 ? "⏰ ¡Se acabó el tiempo!" : "Uy, esa no era 😅");
  $("#fb").style.color = right ? "var(--green)" : "var(--red)";
  buzz(right?30:[60,40,60]);
  setTimeout(()=>{
    if(!right) return fail();
    state.ok++; state.qi++;
    state.qi<3 ? question() : wheel();
  }, 1100);
}

function wheelSVG(){
  const n = PREMIOS.length, r = 100, seg = 360/n;
  const pt = (deg,rad)=>{const a=(deg-90)*Math.PI/180;return [r+rad*Math.cos(a), r+rad*Math.sin(a)]};
  let s = "";
  PREMIOS.forEach((p,i)=>{
    const a0=i*seg, a1=a0+seg, [x0,y0]=pt(a0,r), [x1,y1]=pt(a1,r);
    s += `<path d="M${r},${r} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z" fill="${p.col}" stroke="#fff" stroke-width="1.5"/>`;
    const mid=a0+seg/2, [tx,ty]=pt(mid,r*0.66);
    const fill = p.dark ? "#1D1340" : "#fff";
    const main = p.again ? "TIRÁ" : p.label, sub = p.again ? "DE NUEVO" : "USD";
    s += `<g transform="translate(${tx},${ty}) rotate(${mid})"><text text-anchor="middle" fill="${fill}" font-family="Rubik" font-weight="900" font-size="${p.again?12:(p.label.length>3?15:18)}" y="0">${main}</text>
      <text text-anchor="middle" fill="${p.again?'#FF8A6A':fill}" font-family="Rubik" font-weight="900" font-size="${p.again?8:8}" y="10">${sub}</text></g>`;
  });
  return `<svg viewBox="0 0 200 200">${s}</svg>`;
}

  render(`<div class="center"><h1>${again?"¡Tirá de nuevo!":"¡3 de 3!"}</h1>
    <p class="lead">Girá la ruleta y ganá un voucher para tu pasaje a ${state.dest.n}.</p></div>
    <div class="wheelwrap"><div class="pointer"></div><div class="wheel" id="wheel" style="transform:rotate(${state.rot}deg)">${wheelSVG()}</div><div class="hub">GIRÁ</div></div>
    <button class="btn" id="spin">Girar la ruleta</button>`);

  view.querySelector(".hub").onclick = spin;

function pickPrize(){
  const total = PREMIOS.reduce((a,p)=>a+p.p,0);
  let x = Math.random()*total;
  for(let i=0;i<PREMIOS.length;i++){ if((x-=PREMIOS[i].p) < 0) return i; }
  return 0;
}

async function spin(){
  if(state.spinning) return; state.spinning = true;
  $("#spin").disabled = true; buzz(20);
  let i, serverVoucher = null;
  if(SECURE){
    const r = await api("/api/spin", {sid:sec.sid, dest:state.dest.id});
    if(!r || r.error){ state.spinning=false; return secureMsg("⚠️","Se cortó la sesión","No pudimos confirmar tu jugada. Volvé a escanear el QR del stand."); }
    i = r.index; serverVoucher = r.voucher || null;
  } else i = pickPrize();
  animateWheel(i, ()=>{
    state.spinning = false;
    const p = PREMIOS[i];
    if(p.again){ buzz([40,40,40]); return wheel(true); }
    const v = serverVoucher ? {...serverVoucher, emoji:state.dest.e}
      : {amount:p.v, dest:state.dest.n, emoji:state.dest.e, code:makeCode(p.v), date:new Date().toISOString()};
    if(SECURE){ try{sessionStorage.removeItem("dq-sid"); localStorage.setItem("dq-won", JSON.stringify(v))}catch(e){} }
    confetti(); buzz([80,50,120]);
    voucher(v);
  });
}

/* La ruleta frena con inercia: amaga con el premio vecino más alto y se balancea hasta quedar en el sorteado. */
function animateWheel(i, done){
  const n = PREMIOS.length, seg = 360/n;
  const prev = (i-1+n)%n, next = (i+1)%n;
  const val = k => PREMIOS[k].again ? 250 : PREMIOS[k].v;
  const teaseNext = val(next) > val(prev);                 // vecino con el que amaga
  const b = teaseNext ? (i+1)*seg : i*seg;                 // ángulo del borde con ese vecino
  const sgn = teaseNext ? 1 : -1;                          // hacia dónde queda el vecino
  const a = [ b + sgn*seg*0.38, b - sgn*seg*0.55, b + sgn*seg*0.16, b - sgn*seg*0.42, b + sgn*seg*0.04, b - sgn*seg*(0.25+Math.random()*0.35) ];
  const durs = [4300, 900, 800, 700, 650, 900];
  const base = state.rot - (state.rot % 360);
  const rot1 = base + 360*7 + ((((360 - a[0]) % 360) + 360) % 360);
  const rots = a.map(x => rot1 - (x - a[0]));
  const el = $("#wheel"), start = state.rot;
  const easeOut = t => 1 - Math.pow(1-t, 3), easeIO = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
  let k = 0, t0 = performance.now(), from = start;
  function frame(now){
    const t = Math.min(1, (now - t0)/durs[k]);
    const e = k===0 ? easeOut(t) : easeIO(t);
    const r = from + (rots[k]-from)*e;
    el.style.transform = `rotate(${r}deg)`;
    if(t < 1) return requestAnimationFrame(frame);
    from = rots[k]; k++; t0 = now; buzz(12);
    if(k < rots.length) return requestAnimationFrame(frame);
    state.rot = rots[rots.length-1]; setTimeout(done, 250);
  }
  requestAnimationFrame(frame);
}

function makeCode(v){
  const abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  for(let k=0;k<6;k++) s+=abc[Math.floor(Math.random()*abc.length)];
  return `NAV${v}-${s}`;
}

  `<svg viewBox="0 0 40 40"><rect x="3" y="12" width="34" height="26" rx="3" fill="#fff"/><path d="M3 18h34M3 25h34M3 32h34" stroke="#E61A06" stroke-width="3.5"/><rect x="2" y="9" width="36" height="6" rx="2" fill="#E61A06"/><rect x="17" y="9" width="6" height="29" fill="#028574"/></svg>`,
  `<svg viewBox="0 0 40 40"><path d="M10 14Q6 34 10 38H30Q34 34 30 14Q20 8 10 14Z" fill="#B5651D"/><path d="M12 14Q20 18 28 14L30 8Q20 2 10 8Z" fill="#8B4513"/><path d="M10 14Q20 18 30 14" stroke="#FFD23F" stroke-width="2.5" fill="none"/></svg>`,
  `<svg viewBox="0 0 40 40"><rect x="5" y="12" width="30" height="26" rx="4" fill="#FFB000"/><path d="M5 12L35 38M35 12L5 38" stroke="#E61A06" stroke-width="3"/><rect x="3" y="9" width="34" height="6" rx="2" fill="#FFC838"/><circle cx="20" cy="11" r="4" fill="#E61A06"/></svg>`
];
function santaHTML(){
  // 3 renos y trineo, cada uno con su propio vaivén
  const parts = [["santa_r1",0,21.78],["santa_r2",21.78,19.93],["santa_r3",41.71,20.39],["santa_sleigh",62.09,37.91]];
  return `<img src="/obj/santa.png" alt="" style="visibility:hidden">` + parts.map((p,i)=>`<span class="part" style="left:${p[1]}%;width:${p[2]}%;animation-duration:${(0.7+Math.random()*0.6).toFixed(2)}s;animation-delay:-${(Math.random()*1).toFixed(2)}s"><img src="/obj/${p[0]}.png" alt=""></span>`).join("");
}
let sceneDay = Math.random() < 0.5;
function stopScene(){ sceneTimers.forEach(clearTimeout); sceneTimers = []; }
// round robin: siempre el mismo orden, uno tras otro
function bag(arr){ const a = arr.slice(); for(let k = a.length-1; k > 0; k--){ const j = Math.floor(Math.random()*(k+1)); [a[k],a[j]] = [a[j],a[k]]; } let i = 0; return ()=>a[i++ % a.length]; } // round robin, en orden barajado al cargar
const nextObj = bag(OBJS.filter(o=>o[0]!=="grinch" && o[0]!=="xwing")); // el X-Wing solo aparece persiguiendo al TIE
function startScene(){
  stopScene();
  if(!sceneDay && Math.random() < 0.5) sceneTimers.push(setTimeout(()=>{ const s = sc(); if(s && !sceneDay){ const f = document.createElement("i"); f.className = "fugaz"; f.style.left = (30 + Math.random()*60) + "%"; f.style.top = (8 + Math.random()*30) + "%"; f.addEventListener("animationend", ()=>f.remove()); s.querySelector(".starswrap").appendChild(f); } }, 5000 + Math.random()*15000));
  ["santa_r1","santa_r2","santa_r3","santa_sleigh","grinch"].forEach(n=>{ const i = new Image(); i.src = `/obj/${n}.png`; });
  const sc = ()=>$("#scene");
  const cloud = ()=>{ const s = sc(); if(!s) return;
    const c = document.createElement("i"); c.className = "cloud"; c.innerHTML = CLOUDS[Math.floor(Math.random()*CLOUDS.length)];
    c.style.top = (6 + Math.random()*55) + "%";
    const front = Math.random() < 0.2; // 1 de cada 5 pasa por delante del avión, muy transparente
    if(front){
      c.style.width = Math.round(110 + Math.random()*70) + "px"; c.style.animationDuration = ((9 + Math.random()*4) * (1 + Math.random()*0.5)) + "s";
      c.style.zIndex = 4; c.style.opacity = (0.14+Math.random()*0.1).toFixed(2);
    }else{
      // 3 capas de fondo: lejana (chica, lenta), media y cercana (grande, más rápida), todas al 50 %
      const L = [{w:[40,70],d:[22,30],z:0},{w:[70,110],d:[15,21],z:1},{w:[110,160],d:[11,15],z:2}][Math.floor(Math.random()*3)];
      c.style.width = Math.round(L.w[0] + Math.random()*(L.w[1]-L.w[0])) + "px";
      c.style.animationDuration = ((L.d[0] + Math.random()*(L.d[1]-L.d[0])) * (1 + Math.random()*0.5)) + "s";
      c.style.zIndex = L.z; c.style.opacity = "0.5";
    }
    c.addEventListener("animationend", ()=>c.remove()); s.appendChild(c);
    sceneTimers.push(setTimeout(cloud, 5000 + Math.random()*7000)); };
  let flyCount = 0;
  const spawn = (html, w, top, dur, front, delay=0)=>{ const s = sc(); if(!s) return null;
    const o = document.createElement("span"); o.className = "obj"; o.innerHTML = html;
    o.style.width = w + "px"; o.style.fontSize = (w/100) + "px"; o.style.top = top + "%";
    o.style.zIndex = front ? 4 : 2; o.style.animationDuration = dur + "s"; o.style.animationDelay = delay + "s";
    o.addEventListener("animationend", e=>{ if(e.target === o) o.remove(); }); s.appendChild(o); return o; };
  const thing = ()=>{ const s = sc(); if(!s) return;
    flyCount++;
    const front = Math.random() < 0.5, dur = (9 + Math.random()*5) * (1 + Math.random()*0.5), top = 4 + Math.random()*50;
    if(flyCount % 5 === 0){
      // Papá Noel: renos con vuelo propio, regalos cada tanto y, el 80 % de las veces, el Grinch persiguiéndolo
      const w = 64 * (0.9 + Math.random()*0.3) * (front ? 1.25 : 0.85);
      const santa = spawn(santaHTML(), w, Math.min(top, 30), dur, front);
      // dos ráfagas de 3 regalos por pasada
      const gf1 = 0.26 + Math.random()*0.1, gf2 = 0.58 + Math.random()*0.1;
      [gf1, gf1 + 0.18/dur, gf1 + 0.36/dur, gf2, gf2 + 0.18/dur, gf2 + 0.36/dur].forEach((f,gi0)=>sceneTimers.push(setTimeout(()=>{ const gi = gi0 % 3; const s = sc(); if(!s || !santa || !santa.isConnected) return;
        // el regalo sale del trineo, sigue el avance horizontal y cae con gravedad hasta salir por abajo
        const sr = santa.getBoundingClientRect(), r = s.getBoundingClientRect();
        const g = document.createElement("i"); g.className = "gift"; g.innerHTML = `<i>${GIFTS[Math.floor(Math.random()*GIFTS.length)]}</i>`;
        g.style.left = (sr.left - r.left + sr.width*0.8) + "px"; g.style.top = (sr.top - r.top + sr.height*0.55) + "px"; g.style.width = Math.max(8, Math.round(w*0.13)) + "px";
        g.style.setProperty("--dx", (-720/dur*2.6*(0.8 + gi*0.12)).toFixed(0) + "px");
        g.addEventListener("animationend", e=>{ if(e.target === g) g.remove(); }); s.appendChild(g); }, dur*1000*f)));
      if(Math.random() < 0.8){
        // el Grinch aparece por la derecha, bastante atrás, con su propio vaivén
        const g = OBJS.find(o=>o[0]==="grinch");
        spawn(`<span class="part" style="left:0;width:100%;animation-duration:1.1s"><img src="/obj/grinch.png" alt="">${g[2]}</span>`, w*0.4, Math.min(top, 30) + 6, dur*0.86, front, 4.2); // sale más atrás y, al ir más rápido, se va acercando
      }
    }else{
      const [name, base, fx] = nextObj();
      const w = Math.max(12, Math.round((base < 30 ? base*1.2 : base) * (0.8 + Math.random()*0.4) * (front ? 1.25 : 0.85))); // los chicos, un 20 % más
      const img = new Image(); img.src = `/obj/${name}.png`;
      // todo tiene un vaivén sutil, nada pasa recto
      const wg = WINGS[name];
      const wo = wg && wg[2] || {};
      const body = wg ? `<img src="/obj/${name}_body.png" alt="" class="${wo.back ? "front" : ""}">` + wg[0].map((p,i)=>`<img class="wing${wo.back ? " back" : ""}" src="/obj/${name}_w${i+1}.png" alt="" style="transform-origin:${p[0]}% ${p[1]}%;animation-name:${wo.anim || "flap"};animation-duration:${wg[1]}s;animation-delay:-${(Math.random()*wg[1]).toFixed(2)}s">`).join("") : `<img src="/obj/${name}.png" alt="">`;
      const inner = name === "acrobatico" ? `<span class="stunt">${body}${fx}</span>` : body + fx; // el acrobático hace piruetas
      const go = ()=>{ spawn(`<span class="part" style="left:0;width:100%;animation-duration:${(1.6+Math.random()*1.8).toFixed(2)}s">${inner}</span>`, w, top, dur, front);
        if(name === "tie"){
          // el X-Wing lo persigue: sale más atrás, un poco más rápido, y dispara láseres
          const xw = OBJS.find(o=>o[0]==="xwing"), wx = Math.round(xw[1]*1.2*(front ? 1.25 : 0.85));
          const x = spawn(`<span class="part" style="left:0;width:100%;animation-duration:1.4s"><img src="/obj/xwing.png" alt="">${xw[2]}</span>`, wx, top + 4, dur*0.92, front, 3.2); // más distancia
          const fire = ()=>{ const s = sc(); if(!s || !x || !x.isConnected) return;
            const xr = x.getBoundingClientRect(), r = s.getBoundingClientRect();
            if(xr.right < r.left) return;
            [0, 1].forEach(k=>{ const l = document.createElement("i"); l.className = "laser";
              l.style.left = (xr.left - r.left + 2) + "px"; l.style.top = (xr.top - r.top + xr.height*(k ? 0.68 : 0.3)) + "px";
              l.addEventListener("animationend", ()=>l.remove()); s.appendChild(l); });
            sceneTimers.push(setTimeout(fire, 650 + Math.random()*500)); };
          sceneTimers.push(setTimeout(fire, 2600));
        } };
      if(img.complete) go(); else { img.onload = go; img.onerror = ()=>{}; }
    }
    sceneTimers.push(setTimeout(thing, 12000 + Math.random()*6000)); };
  const shooting = ()=>{ const s = sc(); if(!s || sceneDay) return;
    const f = document.createElement("i"); f.className = "fugaz"; f.style.left = (30 + Math.random()*60) + "%"; f.style.top = (8 + Math.random()*30) + "%";
    f.addEventListener("animationend", ()=>f.remove()); s.querySelector(".starswrap").appendChild(f); };
  const dayNight = ()=>{ const s = sc(); if(!s) return;
    sceneDay = !sceneDay; s.classList.toggle("day", sceneDay);
    if(!sceneDay){ const m = $("#moon"); if(m) m.className = "moon p" + (1 + Math.floor(Math.random()*3)); } // luna: creciente, llena o menguante (nunca nueva)
    if(!sceneDay && Math.random() < 0.5) sceneTimers.push(setTimeout(shooting, 6000 + Math.random()*20000)); // la mitad de las noches, una estrella fugaz
    sceneTimers.push(setTimeout(dayNight, 33000)); };
  const weather = ()=>{ const s = sc(), w = $("#weather"); if(!s || !w) return;
    const kind = Math.random() < 0.5 ? "rain" : "snow";
    // cada gota y cada copo con su propia velocidad, tamaño, retraso y vaivén
    const n = kind === "rain" ? 110 : 60, R = Math.random;
    w.innerHTML = Array.from({length:n}, ()=>{
      const d = kind === "rain" ? (0.85 + R()*1.2) : (3.5 + R()*6);
      const sz = kind === "rain" ? (6 + R()*10) + "px" : (1.5 + R()*2.5) + "px";
      return `<i style="--x:${(R()*100).toFixed(1)}%;--d:${d.toFixed(2)}s;--dl:${(-R()*d).toFixed(2)}s;--s:${sz};--o:${(0.35 + R()*0.6).toFixed(2)};--sw:${(8 + R()*22).toFixed(0)}px"></i>`; }).join("");
    w.className = "weather " + kind + " on";
    sceneTimers.push(setTimeout(()=>{ w.classList.remove("on"); sceneTimers.push(setTimeout(()=>{ if(!w.classList.contains("on")) w.innerHTML = ""; }, 4500)); }, 12000 + Math.random()*8000));
    sceneTimers.push(setTimeout(weather, 45000 + Math.random()*45000)); };
  sceneTimers.push(setTimeout(cloud, 300), setTimeout(thing, 4000), setTimeout(dayNight, 33000), setTimeout(weather, 20000 + Math.random()*30000));
}

function confetti(){
  const c = $("#confetti"), cols=["#4300D2","#7C4DFF","#028574","#E61A06","#270570","#fff"];
  for(let k=0;k<90;k++){const i=document.createElement("i");
    i.style.left=Math.random()*100+"vw"; i.style.background=cols[k%cols.length];
    i.style.animationDuration=(2+Math.random()*2)+"s"; i.style.animationDelay=Math.random()*.6+"s";
    c.appendChild(i);}
  setTimeout(()=>c.innerHTML="",5000);
}

/* ---------- Modo seguro (/qr): pase de un solo uso + una jugada por celular ---------- */
const SECURE = location.pathname.replace(/\/+$/,"") === "/qr";
const sec = {sid:null};

async function api(path, data){
  try{
    const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data),credentials:"same-origin"});
    return await r.json();
  }catch(e){ return null }
}

async function fingerprint(){
  const parts = [screen.width+"x"+screen.height, devicePixelRatio, screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.language, (navigator.languages||[]).join(","),
    navigator.hardwareConcurrency, navigator.deviceMemory, navigator.platform, navigator.maxTouchPoints];
  try{
    const c=document.createElement("canvas"); c.width=240; c.height=60; const x=c.getContext("2d");
    x.textBaseline="top"; x.font="16px Arial"; x.fillStyle="#f60"; x.fillRect(10,10,100,30);
    x.fillStyle="#069"; x.fillText("despegar ✈️ quitz 🎄",4,18); x.globalCompositeOperation="multiply";
    x.fillStyle="rgba(85,15,237,.6)"; x.beginPath(); x.arc(60,30,26,0,Math.PI*2); x.fill();
    parts.push(c.toDataURL());
  }catch(e){}
  try{
    const g=document.createElement("canvas").getContext("webgl"); const d=g.getExtension("WEBGL_debug_renderer_info");
    parts.push(g.getParameter(d?d.UNMASKED_VENDOR_WEBGL:g.VENDOR), g.getParameter(d?d.UNMASKED_RENDERER_WEBGL:g.RENDERER));
  }catch(e){}
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(parts.join("||")));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function localId(){
  try{ let id=localStorage.getItem("dq-lid"); if(!id){ id=crypto.randomUUID(); localStorage.setItem("dq-lid",id); } return id; }catch(e){ return null }
}

function secureMsg(icon,title,text){
  render(`<div class="hero">${scene()}<h1>${icon} ${title}</h1><p class="lead">${text}</p></div>`); startScene();
}

async function secureStart(){
  $("#qrlink").style.display="none";
  const params = new URLSearchParams(location.search), t = params.get("t");
  if(t) history.replaceState(null,"",location.pathname);   // el link ya no sirve para compartir
  try{ const saved = sessionStorage.getItem("dq-sid"); if(saved && !t){ sec.sid = saved; return home(); } }catch(e){}
  secureMsg("✈️","Preparando tu juego…","Un segundo.");
  const r = await api("/api/start", {t, fp: await fingerprint(), lid: localId()});
  if(!r) return secureMsg("📶","Sin conexión","Revisá tu conexión y volvé a escanear el QR del stand.");
  if(r.blocked){
    let v = r.voucher; try{ v = v || JSON.parse(localStorage.getItem("dq-won")) }catch(e){}
    const D = v && DESTINOS.find(d=>d.id===v.destId || d.n===v.dest);
    if(v) return voucher({...v, emoji: D ? D.e : "✈️"}, true);
    return secureMsg("🙅","Ya participaste","Este celular ya jugó. Solo se puede jugar una vez por persona.");
  }
  if(r.error==="store") return secureMsg("🛠️","Estamos preparando todo","El juego todavía no está habilitado. Probá en unos minutos.");
  if(r.error || !r.sid) return secureMsg("📷","Escaneá el QR del stand","Para jugar tenés que escanear el código que se muestra en la pantalla. Cada código sirve una sola vez.");
  sec.sid = r.sid; try{ sessionStorage.setItem("dq-sid", r.sid) }catch(e){}
  home();
}

try{localStorage.removeItem("dq-voucher")}catch(e){}
SECURE ? secureStart() : home();
</script>
