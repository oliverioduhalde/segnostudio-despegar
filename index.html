<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#270570">
<title>Despegar Quitz · Navidad</title>
<meta name="description" content="Elegí tu destino soñado para Navidad, respondé 3 preguntas y girá la ruleta para ganar un voucher.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --top:#270570; --brand:#4300D2; --brand-2:#7C4DFF; --cta:#E61A06; --cta-dark:#C21505; --teal:#028574;
    --ink:#323439; --muted:#72777F; --line:#DDE1E8; --bg:#F2F4F5; --soft:#EFEAFB; --ok:#028574; --bad:#E61A06; --white:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:Rubik,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}
  .app{width:100%;max-width:440px;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
  .topbar{background:var(--top);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
  .topbar img{height:28px;width:auto;display:block}
  .topbar .tag{color:#fff;font-size:.8rem;font-weight:500;opacity:.9}
  .screen{flex:1;display:flex;flex-direction:column;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px}
  h1{color:var(--ink);font-size:1.45rem;line-height:1.2;margin:12px 0 6px;font-weight:600}
  h2{margin:0 0 6px;font-size:1.2rem;font-weight:600;line-height:1.2}
  p.lead{color:var(--muted);margin:0 0 12px;font-size:.95rem;line-height:1.4}
  .muted{color:var(--muted);font-size:.85rem}
  .btn{display:block;width:100%;border:0;border-radius:24px;padding:14px;font:inherit;font-weight:500;font-size:1rem;cursor:pointer;background:var(--cta);color:#fff}
  .btn:active{background:var(--cta-dark)}
  .btn.alt{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .btn:disabled{opacity:.6;cursor:default}
  .mt{margin-top:10px}
  /* escena: el avión queda quieto y el fondo pasa de derecha a izquierda */
  .scene{position:relative;height:150px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#1B0450 0%,#4300D2 60%,#7C4DFF 100%)}
  .scene .layer{position:absolute;inset:0;background-repeat:repeat-x;background-size:400px 100%;animation:scroll linear infinite}
  .scene .stars{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 70px,#fff,transparent),radial-gradient(1px 1px at 160px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 230px 55px,#fff,transparent),radial-gradient(1px 1px at 300px 35px,#fff,transparent),radial-gradient(1.5px 1.5px at 350px 80px,#fff,transparent);opacity:.8;animation-duration:40s}
  .scene .ground{top:auto;height:26px;background:linear-gradient(180deg,#5B2EE6,#8A68F5);animation:none}
  .scene .plane{position:absolute;left:40%;top:50%;width:120px;height:48px;transform:translate(-50%,-50%);animation:fly 2.8s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
  @keyframes fly{0%,100%{transform:translate(-50%,-50%) rotate(-2deg)}50%{transform:translate(-50%,-62%) rotate(2deg)}}
  .scene.sm{height:110px} .scene.sm .plane{width:96px;height:38px}
  @keyframes scroll{to{background-position:-400px 0}}
  .scene .obj{position:absolute;left:100%;font-size:1.4rem;line-height:1;animation:pass linear forwards;will-change:transform}
  @keyframes pass{to{transform:translateX(-560px)}}
  .scene .cloud{position:absolute;left:100%;width:70px;height:22px;background:rgba(255,255,255,.75);border-radius:20px;animation:pass linear forwards}
  .scene .cloud:before{content:"";position:absolute;left:14px;top:-12px;width:30px;height:30px;background:inherit;border-radius:50%}
  .scene .cloud:after{content:"";position:absolute;left:36px;top:-8px;width:24px;height:24px;background:inherit;border-radius:50%}
  /* portada */
  .hero{display:flex;flex-direction:column;flex:1}
  .hero .grow{flex:1}
  .steps{display:grid;gap:8px;margin:12px 0 14px}
  .step{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem;font-weight:500}
  .step b{width:26px;height:26px;flex:none;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:500}
  /* destinos */
  .dests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dest{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px 12px;color:var(--ink);font:inherit;cursor:pointer;text-align:center}
  .dest:active{border-color:var(--brand);background:var(--soft)}
  .dest .e{font-size:2.1rem;display:block}
  .dest .n{font-weight:600;font-size:1rem;display:block;margin-top:4px}
  .dest .c{font-size:.78rem;color:var(--muted)}
  /* pregunta */
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;flex:none;background:var(--soft)}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .dots i.ok{background:var(--teal)} .dots i.now{background:var(--brand)}
  .timerbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 14px}
  .timerbar i{display:block;height:100%;background:var(--brand);transform-origin:left}
  .qtext{font-size:1.1rem;font-weight:600;margin:0 0 14px;line-height:1.3}
  .opts{display:grid;gap:8px}
  .opt{border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:.98rem;text-align:left;cursor:pointer;background:#fff;color:var(--ink)}
  .opt:active{border-color:var(--brand);background:var(--soft)}
  .opt.ok{background:var(--teal);border-color:var(--teal);color:#fff}
  .opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .opt:disabled{cursor:default}
  .feedback{text-align:center;font-weight:600;margin-top:12px;min-height:1.3em}
  /* ruleta */
  .wheelwrap{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:6px auto 14px}
  .wheel{width:100%;height:100%;border-radius:50%;border:6px solid #fff;outline:1px solid var(--line);transition:transform 5.2s cubic-bezier(.12,.72,.08,1)}
  .wheel svg{width:100%;height:100%;display:block}
  .pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid var(--cta);z-index:2}
  .hub{position:absolute;inset:50% auto auto 50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;color:var(--brand);font-size:.8rem;text-align:center;line-height:1}
  /* voucher */
  .voucher{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .voucher .vt{background:var(--brand);color:#fff;padding:16px;text-align:center}
  .voucher .vt .muted{color:rgba(255,255,255,.8)}
  .voucher .amt{font-size:2.6rem;font-weight:700;line-height:1.1}
  .voucher .vb{padding:16px;text-align:center}
  .code{display:inline-block;margin-top:6px;font-family:ui-monospace,Menlo,monospace;font-weight:600;font-size:1.1rem;letter-spacing:2px;background:var(--soft);color:var(--brand);padding:8px 14px;border-radius:8px}
  .fine{font-size:.74rem;color:var(--muted);margin-top:10px;line-height:1.4}
  .center{text-align:center}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti i{position:absolute;top:-20px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .footer{color:var(--muted);font-size:.7rem;text-align:center;padding:0 16px 10px}
  .footer a{color:var(--brand)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="https://www.despegar.com.ar/" aria-label="Despegar"><img src="https://media.staticontent.com/media/pictures/f7cdda6b-2225-4d5d-9b11-fc1ce4f99a7c" alt="despegar"></a>
    <span class="tag" id="pill"></span>
  </div>
  <main id="view" class="screen"></main>
  <div class="footer">Promoción de ejemplo. Vouchers sujetos a bases y condiciones. · <span id="qrlink"><a href="/afiche">Ver QR</a></span></div>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* ---------- Datos ---------- */
const DESTINOS = [
  {id:"bariloche", n:"Bariloche", c:"Argentina", e:"🏔️", col:"#2DB7F5", qs:[
    {q:"¿En qué provincia está Bariloche?", o:["Río Negro","Mendoza","Salta","Misiones"], a:0},
    {q:"¿Por qué dulce es famosa Bariloche?", o:["Chocolate","Alfajor de maicena","Dulce de batata","Turrón"], a:0},
    {q:"¿Cómo se llama el gran lago frente a la ciudad?", o:["Nahuel Huapi","Titicaca","Lago Argentino","Mar Chiquita"], a:0}]},
  {id:"rio", n:"Río de Janeiro", c:"Brasil", e:"🏖️", col:"#1DBF73", qs:[
    {q:"¿En qué país está Río de Janeiro?", o:["Brasil","Chile","México","Uruguay"], a:0},
    {q:"¿Qué estatua famosa mira la ciudad desde el Corcovado?", o:["El Cristo Redentor","La Estatua de la Libertad","El Ángel de la Independencia","El Obelisco"], a:0},
    {q:"¿Cuál de estas playas está en Río?", o:["Copacabana","Punta del Este","Varadero","Waikiki"], a:0}]},
  {id:"nyc", n:"Nueva York", c:"Estados Unidos", e:"🗽", col:"#FF4D8D", qs:[
    {q:"¿Qué estatua recibe a los barcos en Nueva York?", o:["La Estatua de la Libertad","El Cristo Redentor","La Sirenita","El Moái"], a:0},
    {q:"¿Cómo se llama el gran parque en Manhattan?", o:["Central Park","Hyde Park","Parque Rodó","Retiro"], a:0},
    {q:"¿Dónde está el famoso árbol de Navidad gigante?", o:["Rockefeller Center","Torre Eiffel","Plaza de Mayo","Big Ben"], a:0}]},
  {id:"madrid", n:"Madrid", c:"España", e:"🏰", col:"#FF8A1F", qs:[
    {q:"¿En qué país está Madrid?", o:["España","Italia","Portugal","Francia"], a:0},
    {q:"¿Cuál es la plaza más famosa del centro, donde se toman las uvas en Año Nuevo?", o:["Puerta del Sol","Times Square","Plaza San Marcos","Trafalgar"], a:0},
    {q:"¿Cómo se llama el famoso museo de arte de Madrid?", o:["Museo del Prado","Louvre","MoMA","Museo Británico"], a:0}]},
  {id:"cancun", n:"Cancún", c:"México", e:"🌴", col:"#F0384A", qs:[
    {q:"¿En qué país está Cancún?", o:["México","Cuba","Colombia","Perú"], a:0},
    {q:"¿Qué mar baña sus playas?", o:["Mar Caribe","Mar Mediterráneo","Mar del Norte","Mar Muerto"], a:0},
    {q:"¿Qué civilización antigua dejó ruinas cerca, como Chichén Itzá?", o:["Maya","Inca","Romana","Egipcia"], a:0}]},
  {id:"paris", n:"París", c:"Francia", e:"🗼", col:"#7B3BFF", qs:[
    {q:"¿Cuál es el monumento más famoso de París?", o:["La Torre Eiffel","El Coliseo","La Torre de Pisa","El Big Ben"], a:0},
    {q:"¿Qué río atraviesa París?", o:["El Sena","El Támesis","El Danubio","El Paraná"], a:0},
    {q:"¿En qué museo está la Mona Lisa?", o:["El Louvre","El Prado","El Vaticano","El Guggenheim"], a:0}]},
];

/* Ruleta: probabilidad inversa al monto. Suma = 100. */
const PREMIOS = [
  {v:50,   label:"50",   p:30, col:"#7C4DFF"},
  {v:200,  label:"200",  p:15, col:"#028574"},
  {v:0,    label:"OTRA", p:12, col:"#323439", again:true},
  {v:500,  label:"500",  p:4,  col:"#4300D2"},
  {v:100,  label:"100",  p:22, col:"#00A58E"},
  {v:400,  label:"400",  p:6,  col:"#270570"},
  {v:1000, label:"1000", p:1,  col:"#E61A06"},
  {v:300,  label:"300",  p:10, col:"#DDE1E8", dark:true},
];
const SECONDS = 20;

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const view = $("#view");
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const buzz = ms => {try{navigator.vibrate && navigator.vibrate(ms)}catch(e){}};
function render(html){view.classList.remove("screen");void view.offsetWidth;view.classList.add("screen");view.innerHTML=html;window.scrollTo(0,0)}

let state = {dest:null, qi:0, ok:0, timer:null, spinning:false, rot:0};

/* ---------- Pantallas ---------- */
function home(){
  render(`<div class="hero">
    ${scene()}
    <h1>¿A dónde soñás pasar esta Navidad?</h1>
    <p class="lead">Respondé 3 preguntas fáciles y girá la ruleta: podés ganar un voucher de hasta USD 1000 para tu pasaje.</p>
    <div class="steps">
      <div class="step"><b>1</b>Elegí tu destino soñado</div>
      <div class="step"><b>2</b>Acertá 3 preguntas fáciles</div>
      <div class="step"><b>3</b>Girá la ruleta y ganá</div>
    </div>
    <div class="grow"></div>
    <button class="btn" id="go">Jugar ahora</button>
  </div>`);
  startScene(); $("#go").onclick = pickDest;
}

function pickDest(){
  render(`<h1>Elegí tu destino</h1><p class="lead">El voucher que ganes va a ser para un pasaje a ese lugar.</p>
    <div class="dests">${DESTINOS.map(d=>`<button class="dest" style="background:${d.col}" data-id="${d.id}">
      <span class="e">${d.e}</span><span class="n">${d.n}</span><span class="c">${d.c}</span></button>`).join("")}</div>`);
  view.querySelectorAll(".dest").forEach(b=>b.onclick=()=>{
    state.dest = DESTINOS.find(d=>d.id===b.dataset.id); state.qi=0; state.ok=0;
    state.qs = shuffle(state.dest.qs); buzz(20); question();
  });
}

function question(){
  const d = state.dest, q = state.qs[state.qi];
  const opts = shuffle(q.o.map((t,i)=>({t,i})));
  $("#pill").textContent = `${d.e} ${d.n}`;
  render(`<div class="card">
    <div class="qhead"><div class="badge" style="background:${d.col}">${d.e}</div>
      <div><div class="muted">Pregunta ${state.qi+1} de 3</div><b>${d.n}</b></div>
      <div class="dots">${[0,1,2].map(k=>`<i class="${k<state.qi?'ok':k===state.qi?'now':''}"></i>`).join("")}</div></div>
    <div class="timerbar"><i id="tb"></i></div>
    <p class="qtext">${q.q}</p>
    <div class="opts">${opts.map(o=>`<button class="opt" data-i="${o.i}">${o.t}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div></div>`);
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const tb = $("#tb"); tb.style.transition="none"; tb.style.transform="scaleX(1)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{tb.style.transition=`transform ${SECONDS}s linear`;tb.style.transform="scaleX(0)"}));
  clearTimeout(state.timer); state.timer = setTimeout(()=>answer(-1), SECONDS*1000);
}

function answer(pick){
  clearTimeout(state.timer);
  const q = state.qs[state.qi], right = pick===q.a;
  $("#tb").style.transition="none";
  view.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.i;
    if(v===q.a) b.classList.add("ok"); else if(v===pick) b.classList.add("bad");});
  $("#fb").textContent = right ? "¡Correcto! 🎉" : (pick<0 ? "⏰ ¡Se acabó el tiempo!" : "Uy, esa no era 😅");
  $("#fb").style.color = right ? "var(--green)" : "var(--red)";
  buzz(right?30:[60,40,60]);
  setTimeout(()=>{
    if(!right) return fail();
    state.ok++; state.qi++;
    state.qi<3 ? question() : wheel();
  }, 1100);
}

function fail(){
  render(`<div class="hero">${scene()}
    <h1>¡Casi!</h1><p class="lead">Para girar la ruleta tenés que acertar las 3 preguntas. ¿Probamos de nuevo?</p>
    <div class="grow"></div>
    <button class="btn" id="retry">Intentar otra vez</button>
    <button class="btn alt mt" id="other">Cambiar destino</button></div>`);
  startScene();
  $("#retry").onclick = ()=>{state.qi=0;state.ok=0;state.qs=shuffle(state.dest.qs);question()};
  $("#other").onclick = pickDest;
}

function wheelSVG(){
  const n = PREMIOS.length, r = 100, seg = 360/n;
  const pt = (deg,rad)=>{const a=(deg-90)*Math.PI/180;return [r+rad*Math.cos(a), r+rad*Math.sin(a)]};
  let s = "";
  PREMIOS.forEach((p,i)=>{
    const a0=i*seg, a1=a0+seg, [x0,y0]=pt(a0,r), [x1,y1]=pt(a1,r);
    s += `<path d="M${r},${r} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z" fill="${p.col}" stroke="#fff" stroke-width="1.5"/>`;
    const mid=a0+seg/2, [tx,ty]=pt(mid,r*0.66);
    const fill = p.dark ? "#1D1340" : "#fff";
    const main = p.again ? "TIRÁ" : p.label, sub = p.again ? "DE NUEVO" : "USD";
    s += `<g transform="translate(${tx},${ty}) rotate(${mid})"><text text-anchor="middle" fill="${fill}" font-family="Rubik" font-weight="900" font-size="${p.again?12:(p.label.length>3?15:18)}" y="0">${main}</text>
      <text text-anchor="middle" fill="${p.again?'#FF8A6A':fill}" font-family="Rubik" font-weight="900" font-size="${p.again?8:8}" y="10">${sub}</text></g>`;
  });
  return `<svg viewBox="0 0 200 200">${s}</svg>`;
}

function wheel(again){
  $("#pill").textContent = `${state.dest.e} ${state.dest.n}`;
  render(`<div class="center"><h1>${again?"¡Tirá de nuevo!":"¡3 de 3!"}</h1>
    <p class="lead">Girá la ruleta y ganá un voucher para tu pasaje a ${state.dest.n}.</p></div>
    <div class="wheelwrap"><div class="pointer"></div><div class="wheel" id="wheel" style="transform:rotate(${state.rot}deg)">${wheelSVG()}</div><div class="hub">GIRÁ</div></div>
    <button class="btn" id="spin">Girar la ruleta</button>`);
  $("#spin").onclick = spin;
  view.querySelector(".hub").onclick = spin;
}

function pickPrize(){
  let x = Math.random()*100;
  for(let i=0;i<PREMIOS.length;i++){ if((x-=PREMIOS[i].p) < 0) return i; }
  return 0;
}

async function spin(){
  if(state.spinning) return; state.spinning = true;
  $("#spin").disabled = true; buzz(20);
  let i, serverVoucher = null;
  if(SECURE){
    const r = await api("/api/spin", {sid:sec.sid, dest:state.dest.id});
    if(!r || r.error){ state.spinning=false; return secureMsg("⚠️","Se cortó la sesión","No pudimos confirmar tu jugada. Volvé a escanear el QR del stand."); }
    i = r.index; serverVoucher = r.voucher || null;
  } else i = pickPrize();
  const seg = 360/PREMIOS.length;
  const jitter = (Math.random()-.5)*seg*0.7;
  const target = 360 - (i*seg + seg/2) + jitter;           // ángulo que deja el premio bajo el puntero
  const base = state.rot - (state.rot % 360);
  state.rot = base + 360*6 + ((target%360)+360)%360;
  $("#wheel").style.transform = `rotate(${state.rot}deg)`;
  setTimeout(()=>{
    state.spinning = false;
    const p = PREMIOS[i];
    if(p.again){ buzz([40,40,40]); return wheel(true); }
    const v = serverVoucher ? {...serverVoucher, emoji:state.dest.e}
      : {amount:p.v, dest:state.dest.n, emoji:state.dest.e, code:makeCode(p.v), date:new Date().toISOString()};
    if(SECURE){ try{sessionStorage.removeItem("dq-sid"); localStorage.setItem("dq-won", JSON.stringify(v))}catch(e){} }
    confetti(); buzz([80,50,120]);
    voucher(v);
  }, 5400);
}

function makeCode(v){
  const abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  for(let k=0;k<6;k++) s+=abc[Math.floor(Math.random()*abc.length)];
  return `NAV${v}-${s}`;
}

function voucher(v, returning){
  $("#pill").textContent = `${v.emoji} ${v.dest}`;
  render(`${scene("sm")}<div class="center"><h1>${returning?"Tu voucher":"¡Ganaste!"}</h1>
    <p class="lead">${returning?"Ya participaste desde este celular. Solo se puede jugar una vez. Este es tu premio:":"Usalo en la compra de tu pasaje."}</p></div>
    <div class="voucher"><div class="vt"><div class="muted">VOUCHER</div><div class="amt">USD ${v.amount}</div></div>
      <div class="vb"><div style="font-size:2rem">${v.emoji}</div><h2>Pasaje a ${v.dest}</h2>
        <div class="muted">Tu código</div><div class="code">${v.code}</div>
        <div class="fine">Sacale captura a esta pantalla. Válido para la compra de pasajes a ${v.dest}. Sujeto a bases y condiciones de la promoción.</div></div></div>
    <button class="btn mt" id="share">Compartir</button>
    ${SECURE?"":`<button class="btn alt mt" id="again">Jugar de nuevo</button>`}`);
  startScene();
  if(!SECURE) $("#again").onclick = ()=>{ $("#pill").textContent=""; pickDest(); };
  $("#share").onclick = async ()=>{
    const text = `¡Gané un voucher de USD ${v.amount} para viajar a ${v.dest} en el Quitz navideño de Despegar! ✈️🎄`;
    try{ if(navigator.share) await navigator.share({title:"Despegar Quitz",text,url:location.origin+"/"}); else { await navigator.clipboard.writeText(text+" "+location.href); $("#share").textContent="¡Copiado!"; } }catch(e){}
  };
}

/* ---------- Escena: el avión vuela hacia la derecha; el cielo y lo que pasa se mueven en contra ---------- */
function scene(cls=""){
  return `<div class="scene ${cls}" id="scene"><div class="layer stars"></div><svg class="plane" viewBox="0 0 120 48" aria-hidden="true"><path d="M8 26 L22 22 L70 20 Q98 19 112 24 Q98 29 70 28 L22 30 Z" fill="#fff"/><path d="M34 22 L52 6 L62 6 L48 21 Z" fill="#E6E9F0"/><path d="M38 28 L54 42 L64 42 L50 28 Z" fill="#DDE1E8"/><path d="M14 22 L22 10 L30 10 L26 22 Z" fill="#E61A06"/><path d="M70 20 Q98 19 112 24 Q98 29 70 28 Z" fill="#4300D2" opacity=".15"/><circle cx="82" cy="24" r="2" fill="#4300D2"/><circle cx="90" cy="24" r="2" fill="#4300D2"/><circle cx="98" cy="24" r="2" fill="#4300D2"/><path d="M40 31 L52 31 L50 36 L42 36 Z" fill="#4300D2"/></svg><div class="layer ground"></div></div>`;
}
let sceneTimers = [];
const PASSERS = ["🐦","🦅","⭐","🛸","🎈","🌙","🪁","🪐","🚁","🎄","⚽","🦖","🦕","🦩","🐉","🎅","🧦","🍕","🐄","🚀","🪂","🦋","🛰️","🎁","🐧","🛶","🧸","🍌","🐙","🎸","🦒","🧙"];
function stopScene(){ sceneTimers.forEach(clearTimeout); sceneTimers = []; }
function startScene(){
  stopScene();
  const sc = ()=>$("#scene");
  const cloud = ()=>{ const s = sc(); if(!s) return;
    const c = document.createElement("i"); c.className = "cloud";
    c.style.top = (10 + Math.random()*55) + "%"; c.style.transform = `scale(${(0.5+Math.random()*0.8).toFixed(2)})`;
    c.style.animationDuration = (7 + Math.random()*6) + "s"; c.style.opacity = (0.5+Math.random()*0.5).toFixed(2);
    c.addEventListener("animationend", ()=>c.remove()); s.appendChild(c);
    sceneTimers.push(setTimeout(cloud, 1500 + Math.random()*2500)); };
  const thing = ()=>{ const s = sc(); if(!s) return;
    const o = document.createElement("span"); o.className = "obj"; o.textContent = PASSERS[Math.floor(Math.random()*PASSERS.length)];
    o.style.top = (8 + Math.random()*62) + "%"; o.style.fontSize = (1 + Math.random()*1.2) + "rem";
    o.style.animationDuration = (3 + Math.random()*4) + "s";
    o.addEventListener("animationend", ()=>o.remove()); s.appendChild(o);
    sceneTimers.push(setTimeout(thing, 9000 + Math.random()*10000)); };
  sceneTimers.push(setTimeout(cloud, 300), setTimeout(thing, 2500 + Math.random()*4000));
}

function confetti(){
  const c = $("#confetti"), cols=["#4300D2","#7C4DFF","#028574","#E61A06","#270570","#fff"];
  for(let k=0;k<90;k++){const i=document.createElement("i");
    i.style.left=Math.random()*100+"vw"; i.style.background=cols[k%cols.length];
    i.style.animationDuration=(2+Math.random()*2)+"s"; i.style.animationDelay=Math.random()*.6+"s";
    c.appendChild(i);}
  setTimeout(()=>c.innerHTML="",5000);
}

/* ---------- Modo seguro (/qr): pase de un solo uso + una jugada por celular ---------- */
const SECURE = location.pathname.replace(/\/+$/,"") === "/qr";
const sec = {sid:null};

async function api(path, data){
  try{
    const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data),credentials:"same-origin"});
    return await r.json();
  }catch(e){ return null }
}

async function fingerprint(){
  const parts = [screen.width+"x"+screen.height, devicePixelRatio, screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.language, (navigator.languages||[]).join(","),
    navigator.hardwareConcurrency, navigator.deviceMemory, navigator.platform, navigator.maxTouchPoints];
  try{
    const c=document.createElement("canvas"); c.width=240; c.height=60; const x=c.getContext("2d");
    x.textBaseline="top"; x.font="16px Arial"; x.fillStyle="#f60"; x.fillRect(10,10,100,30);
    x.fillStyle="#069"; x.fillText("despegar ✈️ quitz 🎄",4,18); x.globalCompositeOperation="multiply";
    x.fillStyle="rgba(85,15,237,.6)"; x.beginPath(); x.arc(60,30,26,0,Math.PI*2); x.fill();
    parts.push(c.toDataURL());
  }catch(e){}
  try{
    const g=document.createElement("canvas").getContext("webgl"); const d=g.getExtension("WEBGL_debug_renderer_info");
    parts.push(g.getParameter(d?d.UNMASKED_VENDOR_WEBGL:g.VENDOR), g.getParameter(d?d.UNMASKED_RENDERER_WEBGL:g.RENDERER));
  }catch(e){}
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(parts.join("||")));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function localId(){
  try{ let id=localStorage.getItem("dq-lid"); if(!id){ id=crypto.randomUUID(); localStorage.setItem("dq-lid",id); } return id; }catch(e){ return null }
}

function secureMsg(icon,title,text){
  render(`<div class="hero">${scene()}<h1>${icon} ${title}</h1><p class="lead">${text}</p></div>`); startScene();
}

async function secureStart(){
  $("#qrlink").style.display="none";
  const params = new URLSearchParams(location.search), t = params.get("t");
  if(t) history.replaceState(null,"",location.pathname);   // el link ya no sirve para compartir
  try{ const saved = sessionStorage.getItem("dq-sid"); if(saved && !t){ sec.sid = saved; return home(); } }catch(e){}
  secureMsg("✈️","Preparando tu juego…","Un segundo.");
  const r = await api("/api/start", {t, fp: await fingerprint(), lid: localId()});
  if(!r) return secureMsg("📶","Sin conexión","Revisá tu conexión y volvé a escanear el QR del stand.");
  if(r.blocked){
    let v = r.voucher; try{ v = v || JSON.parse(localStorage.getItem("dq-won")) }catch(e){}
    const D = v && DESTINOS.find(d=>d.id===v.destId || d.n===v.dest);
    if(v) return voucher({...v, emoji: D ? D.e : "✈️"}, true);
    return secureMsg("🙅","Ya participaste","Este celular ya jugó. Solo se puede jugar una vez por persona.");
  }
  if(r.error==="store") return secureMsg("🛠️","Estamos preparando todo","El juego todavía no está habilitado. Probá en unos minutos.");
  if(r.error || !r.sid) return secureMsg("📷","Escaneá el QR del stand","Para jugar tenés que escanear el código que se muestra en la pantalla. Cada código sirve una sola vez.");
  sec.sid = r.sid; try{ sessionStorage.setItem("dq-sid", r.sid) }catch(e){}
  home();
}

try{localStorage.removeItem("dq-voucher")}catch(e){}
SECURE ? secureStart() : home();
</script>
